<!-- Thank-you card — FRONT. 5.25in x 7.25in (5x7 flat + 1/8in bleed). Matches the invitation:
     warm-white paper, gold arch frame, blush florals, Allura script, Bodoni/Cormorant small caps.
     The back is Postable's message layout (handwriting font), personalised per recipient. -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Thank you — front</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  @page { size: 5.25in 7.25in; margin: 0; }
  html, body { margin: 0; }
  :root { --gold: #AF9466; --sage: #7E826B; --ink: #3C3B3B; --paper: #FBF9F5; }
  body { width: 5.25in; height: 7.25in; background: var(--paper); font-family: 'Cormorant Garamond', Georgia, serif; color: var(--ink); overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .card { position: relative; width: 5.25in; height: 7.25in; }
  .card::before { content: ""; position: absolute; inset: 0; background:
      radial-gradient(ellipse at 50% 48%, rgba(255,255,255,0.85), transparent 62%),
      radial-gradient(ellipse at 15% 12%, rgba(226,214,200,0.10), transparent 50%),
      radial-gradient(ellipse at 88% 90%, rgba(226,214,200,0.10), transparent 50%); }
  .frame, .frame::after { position: absolute; border: 1px solid var(--gold); border-radius: 1.85in 1.85in 0 0; }
  .frame { left: 0.78in; right: 0.78in; top: 0.62in; bottom: 0.62in; }
  .frame::after { content: ""; left: 0.055in; right: 0.055in; top: 0.055in; bottom: 0.055in; border-radius: 1.8in 1.8in 0 0; }
  .photo { position: absolute; left: 50%; top: 1.0in; width: 2.75in; height: 3.35in; margin-left: -1.375in;
           border-radius: 1.375in 1.375in 0 0; overflow: hidden; background: url('../assets/photos/card-front.jpg') center 28% / cover no-repeat; }
  .floral { position: absolute; display: block; }
  .tl { left: -0.3in; top: -0.28in; width: 3.1in; }
  .br { right: -0.32in; bottom: -0.3in; width: 3.2in; }
  .text { position: absolute; left: 0.9in; right: 0.9in; top: 4.55in; text-align: center; }
  .script { font-family: 'Allura', 'Snell Roundhand', cursive; font-size: 44pt; line-height: 1; color: var(--gold); }
  .rule { display: flex; align-items: center; justify-content: center; gap: 0.12in; margin: 10pt 0 8pt; }
  .rule i { display: block; width: 0.42in; height: 1px; background: var(--gold); }
  .rule span { width: 5px; height: 5px; background: var(--gold); transform: rotate(45deg); }
  .names { font-size: 9.5pt; letter-spacing: 0.3em; text-transform: uppercase; font-weight: 500; color: var(--sage); }
  .sub { font-size: 8pt; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink); margin-top: 6pt; }
</style>
</head>
<body>
<div class="card">
  <div class="frame"></div>
  <div class="photo"></div>
  <img class="floral tl" src="../assets/florals/corner-tl-pink.png" alt="">
  <img class="floral br" src="../assets/florals/corner-br-pink.png" alt="">
  <div class="text">
    <div class="script">Thank you</div>
    <div class="rule"><i></i><span></span><i></i></div>
    <div class="names">Noah &amp; Bethany</div>
    <div class="sub">November 28, 2026</div>
  </div>
</div>
</body>
</html>
