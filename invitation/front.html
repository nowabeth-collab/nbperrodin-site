<!-- Formal invitation — FRONT.
     5.25in x 7.25in = a 5x7 flat card plus 1/8in bleed on every side (the printer trims to 5 x 7).
     Keep anything important at least 1/4in from the edge of this file.
     Open this file in a browser to preview; invitation-5x7.pdf is the print-ready export. -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Invitation — front</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  @page { size: 5.25in 7.25in; margin: 0; }
  html, body { margin: 0; }
  body { width: 5.25in; height: 7.25in; background: #F4F0E9; font-family: 'Jost', Helvetica, Arial, sans-serif; color: #4E5B44; overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .card { position: relative; width: 5.25in; height: 7.25in; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0.3in 0.55in 0.75in; }
  .arch { width: 3.7in; display: block; margin: 0 auto 0.1in; }
  .eyebrow { font-size: 7.5pt; letter-spacing: 0.3em; text-transform: uppercase; color: #B98E8C; font-weight: 400; margin: 0 0 12pt; }
  .name { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 31pt; font-weight: 500; line-height: 1.05; letter-spacing: 0.02em; }
  .and { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 16pt; color: #B98E8C; margin: 3pt 0; }
  .invite { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 13.5pt; color: #7A736A; margin-top: 12pt; }
  .rule { width: 0.45in; height: 1px; background: #B98E8C; margin: 14pt auto; }
  .when { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 14.5pt; line-height: 1.45; color: #4E5B44; }
  .where { margin-top: 14pt; font-size: 8.5pt; letter-spacing: 0.24em; text-transform: uppercase; color: #3A3833; line-height: 1.9; }
  .where .addr { font-size: 7.5pt; letter-spacing: 0.18em; color: #7A736A; }
  .foot { margin-top: 12pt; font-size: 7.5pt; letter-spacing: 0.24em; text-transform: uppercase; color: #B98E8C; }
  .corner { position: absolute; right: -0.18in; bottom: -0.2in; width: 2.0in; }
</style>
</head>
<body>
<div class="card">
  <img class="arch" src="../assets/florals/arch.webp" alt="">
  <div class="eyebrow">Together with their families</div>
  <div class="name">Bethany Kline</div>
  <div class="and">and</div>
  <div class="name">Noah Perrodin</div>
  <div class="invite">invite you to celebrate their marriage</div>
  <div class="rule"></div>
  <div class="when">Saturday, the twenty-eighth of November<br>two thousand twenty-six<br>at five o&rsquo;clock in the evening</div>
  <div class="where">Camp Hosea<br><span class="addr">17476 FM 3090 &middot; Anderson, Texas</span></div>
  <div class="foot">Reception to follow</div>
  <img class="corner" src="../assets/florals/corner-br.webp" alt="">
</div>
</body>
</html>
