<!-- Lob 4x6 postcard FRONT. Trim 6" x 4"; template is 6.25" x 4.25" incl. 1/8" bleed.
     Photo is hosted on the live site — change the URL if you host it elsewhere.
     Preview locally by opening this file in a browser (it's fixed-size). -->
<html>
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { width: 6.25in; height: 4.25in; margin: 0; background: #F7F4EE; font-family: 'Jost', Helvetica, Arial, sans-serif; color: #2F4A3B; }
  .card { width: 6.25in; height: 4.25in; display: flex; }
  .photo { width: 2.95in; height: 100%; background: url('https://nbperrodin.com/assets/photos/card-front.jpg') center / cover no-repeat; }
  .text { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0.35in 0.3in; }
  .eyebrow { font-size: 8pt; letter-spacing: 0.25em; text-transform: uppercase; color: #B9975B; margin-bottom: 10pt; }
  .names { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 27pt; font-weight: 500; line-height: 1.05; }
  .names em { color: #B9975B; font-style: italic; }
  .rule { width: 0.4in; height: 1px; background: #B9975B; margin: 10pt auto; }
  .date { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 17pt; letter-spacing: 0.08em; }
  .place { font-size: 8pt; letter-spacing: 0.2em; text-transform: uppercase; color: #6B655C; margin-top: 6pt; }
  .foot { font-size: 7.5pt; letter-spacing: 0.1em; text-transform: uppercase; color: #6B655C; margin-top: 18pt; }
</style>
</head>
<body>
<div class="card">
  <div class="photo"></div>
  <div class="text">
    <div class="eyebrow">Save the date</div>
    <div class="names">Noah<br><em>&amp;</em> Bethany</div>
    <div class="rule"></div>
    <div class="date">11 · 28 · 2026</div>
    <div class="place">Anderson, Texas</div>
    <div class="foot">Formal invitation to follow</div>
  </div>
</div>
</body>
</html>
