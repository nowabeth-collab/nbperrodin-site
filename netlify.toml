[build]
  publish = "."

# Clean URLs: nbperrodin.com/save-the-date works without .html
[[redirects]]
  from = "/save-the-date"
  to = "/save-the-date.html"
  status = 200
[[redirects]]
  from = "/wedding-party"
  to = "/wedding-party.html"
  status = 200
[[redirects]]
  from = "/registry"
  to = "/registry.html"
  status = 200
[[redirects]]
  from = "/gallery"
  to = "/gallery.html"
  status = 200
[[redirects]]
  from = "/photos"
  to = "/photos.html"
  status = 200
# Standalone save-the-date link for guests (short, printable)
[[redirects]]
  from = "/std"
  to = "/std.html"
  status = 200
[[redirects]]
  from = "/savethedate"
  to = "/std.html"
  status = 200

[[headers]]
  for = "/*.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Content-Disposition = "attachment; filename=nbperrodin-wedding.ics"
[[headers]]
  for = "/assets/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
